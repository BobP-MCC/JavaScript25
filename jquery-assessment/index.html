<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beginning jQuery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik+80s+Fade&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Bungee+Spice&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-..." crossorigin="anonymous"></script>
    <script src="scripts/script.js" defer></script>
</head>
<body>
    <header>
        <h1>jQuery Effects</h1>
        <h1 class="subtitle">80s Style!</h1>
    </header>
    <main>
        <section>
        <h2>Move It!</h2>
        <div class="center">
        <button id="up">Up</button>
        <button id="down">Down</button>
        <button id="left">Left</button>
        <button id="right">Right</button>
        </div>
        <div class="center" id="movespace">
        <img src="images/delorian.jpg" alt="Delorian" id="move">
        </div>
        

        <h2>ET - Phone Home</h2>
        <div class="center">
        <button id="stop">Stop the call!</button>

        <div id="phone-home">Click Here to Phone Home!</div>
        <div id="et"><img src="images/et.jpg" alt="ET"></div>

        <h2>More Than Meets the Eye</h2>
        <div class="center">
        <button id="transform">Transform!</button>
        </div>
        <div class="center" id="optimus">
        <img src="images/optimus-robot.jpg" alt="Optimus Prime Robot" id="optimus-robot">
        <img src="images/optimus-prime-truck.jpg" alt="Optimus Prime Truck" id="optimus-truck">
        </div>
        
        <h2>Mr. T</h2>
        <div class="center">
        <button id="pity">Pity the Fool...</button>
        </div>
        <div class="center" id="MrT">
        <img src="images/MrT.jpg" alt="Mr. T" id="MrT-image">

        </div>



    </section>
</main>
<footer>
    <p>&copy; Bob Peck</p>
</footer>
</body>
</html>
