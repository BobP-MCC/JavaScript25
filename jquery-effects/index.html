<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beginning jQuery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jolly+Lodger&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="scripts/script.js" defer></script>
</head>
<body>
    <header>
        <h1>jQuery Effects, Hogwarts Style</h1>
    </header>
    <main>
        <section>
        <h2>Apparition</h2>
        <div class="center">
        <button id="apparate">Apparate!</button>
        <button id="disapparate">Disapparate!</button>
        </div>
        <div class="center" id="dumbledore">
        <img src="images/Dumbledore.jpg" alt="Dumbledore">
        </div>
        

        <h2>The Marauder's Map</h2>
        <div class="center">
        <button id="mapshow">I solemnly swear that I am up to no good</button>
        <button id="maphide">Mischief managed</button>
        </div>
        <div class="center" id="map">
        <img src="images/maraudersmap.jpg" alt="Marauder's Map">
        </div>
        
        <h2>Travel by Flue Powder</h2>
        <div class="center">
        <button id="flue">Flue!</button>
        </div>
        <div class="center" id="fluepowder">
        <img src="images/flue.jpg" alt="Flue Powder">
        
    </section>
</main>
<footer>
    <p>&copy; Bob Peck</p>
</footer>
</body>
</html>
