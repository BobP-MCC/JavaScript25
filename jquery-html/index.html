<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery HTML</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="scripts/script.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body id="body" class="masquerade-background">
    <header id="header" class="masquerade-header">
        <h1>Costume Party Sign-Up</h1>
    </header>
    <main id="main" class="masquerade-main">
    <div id="button-group" class="masquerade-button-group">
        <button id="halloween">Halloween Theme</button>
        <button id="masquerade">Masquerade Theme</button>
        <button id="larger">Increase Font Size</button>
        <button id="smaller">Decrease Font Size</button>
    </div>
        
        <form>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname">
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname">
            <br><br>
            <label for="costume">Costume Idea:</label>
            <input type="text" id="costume" name="costume">
            <br><br>
            <button id="submit">Submit</button>
        </form>
        <p>&nbsp;</p>
        <p>The following costumes have been submitted:</p>
        <div id="costumeList"></div>
    </main>
    <footer id="footer" class="masquerade-footer">
        <p>&copy; 2024 Bob Peck</p>
    </footer>
</body>
</html>
